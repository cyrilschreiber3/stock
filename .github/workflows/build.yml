name: Build

on:
  push:
    branches:
      - master
      - dev
      - int
      - prod
    tags:
      - v*

permissions:
  packages: write
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Run tests
        run: nix develop --command make test

  build:
    runs-on: ubuntu-latest
    needs: test

    env:
      IMAGE_NAME: ghcr.io/cyrilschreiber3/stock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            MAJOR="v$(echo "$VERSION" | cut -d. -f1)"
            MINOR="v$(echo "$VERSION" | cut -d. -f1-2)"
            echo "tag_list=$MAJOR,$MINOR,$TAG,latest" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ github.ref_name }}"
            if [ "$BRANCH" = "master" ]; then
              echo "tag_list=unstable" >> "$GITHUB_OUTPUT"
            else
              echo "tag_list=$BRANCH" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        env:
          IMAGE_TAG_LIST: ${{ steps.tags.outputs.tag_list }}
        run: make docker-image

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          for tag in $(echo "${{ steps.tags.outputs.tag_list }}" | tr ',' ' '); do
            docker push "$IMAGE_NAME:$tag"
          done
