version: "2"
sql:
  - engine: postgresql
    schema: ./database/migrations
    queries: ./database/queries
    gen:
      go:
        emit_json_tags: true
        package: repository
        out: ./database/repository
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: pg_catalog.int4
            go_type: int

          - column: "product_with_details.category"
            go_type:
              type: Category
          - column: "product_with_details.subcategory"
            go_type:
              type: Subcategory
          - column: "product_with_details.supplier"
            go_type:
              type: Supplier

          - column: "subcategory_with_details.category"
            go_type:
              type: Category

          - column: "transaction_item_with_details.product"
            go_type:
              type: Product

          - column: "transaction_with_details.supplier"
            go_type:
              type: Supplier
              pointer: true

          - column: "transaction_item_with_transaction_details.product"
            go_type:
              type: Product
          - column: "transaction_item_with_transaction_details.transaction"
            go_type:
              type: TransactionWithDetail

          - column: "transaction_with_details_and_items.transaction_items"
            go_type:
              type: TransactionItemWithDetail
              slice: true
          - column: "transaction_with_details_and_items.supplier"
            go_type:
              type: Supplier
              pointer: true

          - column: "inventory_with_details.product"
            go_type:
              type: ProductWithDetail

          - column: "inventory_lot_with_details.product"
            go_type:
              type: ProductWithDetail
          - column: "inventory_lot_with_details.transaction_item"
            go_type:
              type: TransactionItemWithTransactionDetail
